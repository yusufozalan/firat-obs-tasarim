<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fırat Üniversitesi - Öğrenci Bilgi Sistemi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- İkiye Bölünmüş Ekran Yapısı -->
    <div class="split-container">
        
        <!-- Sol Taraf: Giriş Formu -->
        <div class="left-panel">
            <div class="login-card">
                <button class="lang-switch" id="lang-btn">
                    <i class="fa-solid fa-globe"></i>
                    <span id="lang-text">English</span>
                </button>

                <div class="logo-container">
                    <img src="images/fu_logo_orta.png" class="univ-logo-img" alt="Fırat Üniversitesi">
                </div>

                <h1 class="univ-title">Fırat Üniversitesi</h1>
                <p class="sys-subtitle">Öğrenci Bilgi Sistemi</p>
                
                <div class="divider"></div>
                <p class="scope-text">Önlisans / Lisans / Enstitü</p>

                <div class="button-group">
                    <a href="#" class="login-btn" data-role="Öğrenci">
                        <div class="btn-content"><i class="fa-solid fa-user-graduate"></i><span>Öğrenci Girişi</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="#" class="login-btn" data-role="Akademisyen">
                        <div class="btn-content"><i class="fa-solid fa-chalkboard-user"></i><span>Akademisyen Girişi</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="#" class="login-btn" data-role="İdari Personel">
                        <div class="btn-content"><i class="fa-solid fa-user-tie"></i><span>İdari Personel Girişi</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                    <a href="#" class="login-btn" data-role="Mezun Öğrenci">
                        <div class="btn-content"><i class="fa-solid fa-graduation-cap"></i><span>Mezun Öğrenci Girişi</span></div>
                        <i class="fa-solid fa-chevron-right arrow-icon"></i>
                    </a>
                </div>

                <div class="footer-text">
                    &copy; 2026 Fırat Üniversitesi. Tüm Hakları Saklıdır.
                </div>
            </div>
        </div>

        <div class="right-panel">
            <div class="animated-logo-container">
                <img src="images/fu_logo_black_white.png" class="bg-logo-large" alt="Kurumsal Logo">
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
